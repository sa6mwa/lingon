syntax = "proto3";

package lingon.protocol;

option go_package = "pkt.systems/lingon/internal/protocolpb;protocolpb";
option java_package = "systems.pkt.lingon.protocol";
option java_multiple_files = true;

message Frame {
  string session_id = 1;
  uint64 seq = 2;

  oneof payload {
    Hello hello = 10;
    Welcome welcome = 11;
    Snapshot snapshot = 12;
    Diff diff = 13;
    Out out = 14;
    In in = 15;
    Resize resize = 16;
    Control control = 17;
    Error error = 18;
    Scrollback scrollback = 19;
    Sessions sessions = 20;
    Wall wall = 21;
    SessionClosed session_closed = 22;
    Command command = 23;
    WallInactivityStatus wall_inactivity_status = 24;
    Activity activity = 25;
  }
}

message Hello {
  string client_id = 1;
  uint32 cols = 2;
  uint32 rows = 3;
  bool wants_control = 4;
  uint64 last_seq = 5;
  string client_type = 6;
  bool headless = 7;
}

message Welcome {
  bool granted_control = 1;
  uint32 server_cols = 2;
  uint32 server_rows = 3;
  string holder_client_id = 4;
}

message Snapshot {
  uint32 cols = 1;
  uint32 rows = 2;
  repeated uint32 runes = 3 [packed = true];
  repeated int32 modes = 4 [packed = true];
  repeated uint32 fg = 5 [packed = true];
  repeated uint32 bg = 6 [packed = true];
  Cursor cursor = 7;
  bool cursor_visible = 8;
  uint32 mode = 9;
  string title = 10;
  repeated string graphemes = 11;
}

message DiffRow {
  uint32 row = 1;
  repeated uint32 runes = 2 [packed = true];
  repeated int32 modes = 3 [packed = true];
  repeated uint32 fg = 4 [packed = true];
  repeated uint32 bg = 5 [packed = true];
  repeated string graphemes = 6;
}

message Diff {
  uint32 cols = 1;
  uint32 rows = 2;
  repeated DiffRow diff_rows = 3;
  Cursor cursor = 4;
  bool cursor_visible = 5;
  uint32 mode = 6;
  string title = 7;
}

message ScrollbackRow {
  repeated uint32 runes = 1 [packed = true];
  repeated int32 modes = 2 [packed = true];
  repeated uint32 fg = 3 [packed = true];
  repeated uint32 bg = 4 [packed = true];
  repeated string graphemes = 5;
}

message Scrollback {
  uint32 cols = 1;
  bool clear = 2;
  repeated ScrollbackRow rows = 3;
}

message Out {
  bytes data = 1;
}

message In {
  bytes data = 1;
}

enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  COMMAND_KIND_SEND_EOF = 1;
  COMMAND_KIND_TOGGLE_OFFLINE = 2;
  COMMAND_KIND_TOGGLE_RESPAWN = 3;
  COMMAND_KIND_CYCLE_WALL_INACTIVITY = 4;
}

enum WallKind {
  WALL_KIND_UNSPECIFIED = 0;
  WALL_KIND_INACTIVITY = 1;
}

message Command {
  CommandKind kind = 1;
}

message Resize {
  uint32 cols = 1;
  uint32 rows = 2;
}

message Control {
  string holder_client_id = 1;
}

message Error {
  string message = 1;
  uint32 retry_after_seconds = 2;
  bool session_rejected = 3;
}

message Cursor {
  uint32 x = 1;
  uint32 y = 2;
}

message Sessions {
  repeated SessionInfo sessions = 1;
}

message SessionInfo {
  string id = 1;
  string name = 2;
  string status = 3;
  int64 last_active_unix = 4;
  bool headless = 5;
}

message Wall {
  string sender = 1;
  string message = 2;
  uint32 timeout_seconds = 3;
  uint64 id = 4;
  WallKind kind = 5;
  string source_session_id = 6;
  string source_session_name = 7;
}

message WallInactivityStatus {
  bool enabled = 1;
  string inactive_after = 2;
  string error = 3;
}

message SessionClosed {
  string reason = 1;
}

message Activity {}
